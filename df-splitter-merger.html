<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Splitter & Merger</title>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
background:#111827;
color:white;
padding:30px;
}
.container{
max-width:900px;
margin:auto;
}
h1{
text-align:center;
margin-bottom:25px;
}
.card{
background:#1f2937;
padding:20px;
border-radius:12px;
margin-bottom:25px;
}
.drop{
border:2px dashed #4b5563;
padding:30px;
text-align:center;
border-radius:10px;
cursor:pointer;
transition:.3s;
}
.drop:hover{
border-color:#3b82f6;
}
input[type=file]{
display:none;
}
button{
background:#2563eb;
border:none;
padding:12px 20px;
border-radius:8px;
color:white;
cursor:pointer;
margin-top:15px;
}
button:hover{
background:#1d4ed8;
}
input[type=text]{
width:100%;
padding:12px;
margin-top:15px;
border-radius:8px;
border:none;
}
#files{
margin-top:15px;
}
.file{
padding:8px;
background:#374151;
border-radius:6px;
margin-top:8px;
}
.success{
margin-top:10px;
color:#22c55e;
}
</style>
</head>

<body>

<div class="container">

<h1>📄 PDF Splitter & Merger</h1>

<div class="card">

<h2>Merge PDFs</h2>

<label class="drop">
Click or Drop PDFs Here
<input type="file" id="mergeInput" multiple accept=".pdf">
</label>

<div id="files"></div>

<button onclick="mergePDFs()">Merge PDFs</button>

<div id="mergeStatus" class="success"></div>

</div>

<div class="card">

<h2>Split PDF</h2>

<label class="drop">
Select PDF
<input type="file" id="splitInput" accept=".pdf">
</label>

<input
id="range"
type="text"
placeholder="Example: 1-3 or 5 or 7-10">

<button onclick="splitPDF()">Split PDF</button>

<div id="splitStatus" class="success"></div>

</div>

</div>

<script>

const mergeInput=document.getElementById("mergeInput");
const filesDiv=document.getElementById("files");

mergeInput.onchange=()=>{
filesDiv.innerHTML="";
[...mergeInput.files].forEach(f=>{
filesDiv.innerHTML+=`<div class="file">${f.name}</div>`;
});
}

async function mergePDFs(){

const merged=await PDFLib.PDFDocument.create();

for(const file of mergeInput.files){

const bytes=await file.arrayBuffer();

const pdf=await PDFLib.PDFDocument.load(bytes);

const pages=await merged.copyPages(pdf,pdf.getPageIndices());

pages.forEach(p=>merged.addPage(p));

}

const pdfBytes=await merged.save();

download(pdfBytes,"Merged.pdf");

document.getElementById("mergeStatus").innerHTML="Merged Successfully ✔";

}

async function splitPDF(){

const file=document.getElementById("splitInput").files[0];

if(!file){
alert("Choose PDF");
return;
}

const range=document.getElementById("range").value.trim();

const bytes=await file.arrayBuffer();

const pdf=await PDFLib.PDFDocument.load(bytes);

const out=await PDFLib.PDFDocument.create();

let pages=[];

if(range.includes("-")){

let r=range.split("-");

let s=parseInt(r[0]);

let e=parseInt(r[1]);

for(let i=s;i<=e;i++)
pages.push(i-1);

}else{

pages.push(parseInt(range)-1);

}

const copied=await out.copyPages(pdf,pages);

copied.forEach(p=>out.addPage(p));

const outBytes=await out.save();

download(outBytes,"Split.pdf");

document.getElementById("splitStatus").innerHTML="Split Completed ✔";

}

function download(bytes,name){

const blob=new Blob([bytes],{type:"application/pdf"});

const url=URL.createObjectURL(blob);

const a=document.createElement("a");

a.href=url;

a.download=name;

a.click();

URL.revokeObjectURL(url);

}

</script>

</body>
</html>
