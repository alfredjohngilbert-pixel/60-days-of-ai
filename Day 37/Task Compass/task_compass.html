<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Compass — School / University</title>
<style>
  :root{
    --bg1:#0b0f1a; --bg2:#131a2b; --card:#161d2f; --glass:rgba(255,255,255,0.05);
    --border:rgba(255,255,255,0.09); --text:#e8ecf7; --sub:#9aa4c0; --accent:#7c9dff;
    --accent2:#ff8bd0; --good:#5be3a4; --warn:#ffcf6b; --danger:#ff6b8b;
    --teacher:#7c9dff; --principal:#ff8bd0; --it:#5be3a4; --advisor:#ffcf6b;
    --affairs:#ff9f6b; --parent:#c58bff; --curriculum:#6bdcff; --counselor:#ff6bb0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2) 60%,#1a1030);
    background-size:200% 200%;
    animation:bgshift 18s ease infinite;
    color:var(--text); min-height:100vh; overflow-x:hidden;
  }
  @keyframes bgshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .wrap{max-width:980px; margin:0 auto; padding:28px 18px 80px;}
  header{text-align:center; margin-bottom:22px;}
  h1{font-size:2.2rem; background:linear-gradient(90deg,var(--accent),var(--accent2));
     -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:800;}
  .subtitle{color:var(--sub); margin-top:6px; font-size:1rem;}
  .progress-wrap{display:flex; justify-content:center; gap:10px; margin:20px 0;}
  .stage-dot{padding:8px 16px; border-radius:20px; background:var(--glass); border:1px solid var(--border);
    font-size:0.85rem; color:var(--sub); transition:.3s;}
  .stage-dot.active{background:linear-gradient(90deg,var(--accent),var(--accent2)); color:#0b0f1a; font-weight:700;}
  .stage-dot.done{border-color:var(--good); color:var(--good);}
  .qcount{text-align:center; color:var(--sub); font-size:0.85rem; margin-bottom:18px;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:18px; padding:26px;
    backdrop-filter:blur(10px); box-shadow:0 10px 30px rgba(0,0,0,0.3); animation:fadeIn .5s ease;
  }
  @keyframes fadeIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  .ticket{
    background:linear-gradient(135deg,rgba(124,157,255,0.12),rgba(255,139,208,0.08));
    border:1px dashed var(--accent); border-radius:14px; padding:18px 20px; margin-bottom:22px;
    position:relative;
  }
  .ticket-tag{font-size:0.7rem; text-transform:uppercase; letter-spacing:1px; color:var(--accent); font-weight:700;}
  .ticket-text{font-size:1.15rem; margin-top:8px; line-height:1.4;}
  .roles-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:18px 0;}
  .role-card{
    background:var(--glass); border:1px solid var(--border); border-radius:14px; padding:14px 10px;
    text-align:center; cursor:grab; user-select:none; transition:.25s; position:relative;
  }
  .role-card:hover{transform:translateY(-4px); box-shadow:0 8px 20px rgba(124,157,255,0.25); border-color:var(--accent);}
  .role-card.dragging{opacity:0.4;}
  .role-card .emoji{font-size:1.8rem; display:block; margin-bottom:6px;}
  .role-card .rname{font-size:0.85rem; font-weight:600;}
  .dropzone{
    min-height:70px; border:2px dashed var(--border); border-radius:14px; margin-top:10px;
    display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
    transition:.25s; padding:10px; color:var(--sub); font-size:0.9rem;
  }
  .dropzone.over{border-color:var(--accent); background:rgba(124,157,255,0.08);}
  .dropzone .placed{
    background:linear-gradient(90deg,var(--accent),var(--accent2)); color:#0b0f1a; font-weight:700;
    padding:10px 16px; border-radius:10px; animation:pop .3s ease;
  }
  @keyframes pop{0%{transform:scale(0.7);opacity:0;} 100%{transform:scale(1);opacity:1;}}
  .order-list{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .order-slot{
    min-height:52px; border:2px dashed var(--border); border-radius:12px; display:flex;
    align-items:center; padding:0 14px; gap:10px; color:var(--sub); font-size:0.85rem; transition:.25s;
  }
  .order-slot.over{border-color:var(--accent); background:rgba(124,157,255,0.08);}
  .order-slot .step-num{
    width:26px; height:26px; border-radius:50%; background:var(--glass); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:0.75rem; font-weight:700; flex-shrink:0;
  }
  .order-slot .placed{
    background:linear-gradient(90deg,var(--accent),var(--accent2)); color:#0b0f1a; font-weight:700;
    padding:8px 14px; border-radius:8px; animation:pop .3s ease;
  }
  .btn-row{display:flex; justify-content:center; gap:14px; margin-top:24px; flex-wrap:wrap;}
  button{
    background:linear-gradient(90deg,var(--accent),var(--accent2)); color:#0b0f1a; border:none;
    padding:13px 26px; border-radius:12px; font-weight:700; font-size:0.95rem; cursor:pointer; transition:.2s;
  }
  button:hover{transform:translateY(-2px); box-shadow:0 8px 18px rgba(124,157,255,0.35);}
  button:disabled{opacity:0.4; cursor:not-allowed; transform:none; box-shadow:none;}
  button.secondary{background:var(--glass); color:var(--text); border:1px solid var(--border);}
  .feedback{margin-top:22px; padding:20px; border-radius:14px; background:rgba(91,227,164,0.08);
    border:1px solid rgba(91,227,164,0.3); animation:fadeIn .5s ease;}
  .feedback h3{color:var(--good); margin-bottom:10px; font-size:1.05rem;}
  .feedback p{color:var(--text); font-size:0.92rem; line-height:1.5; margin-bottom:8px;}
  .feedback .assist{color:var(--sub); font-size:0.85rem;}
  .flow-anim{display:flex; align-items:center; justify-content:center; gap:8px; margin:20px 0; flex-wrap:wrap;}
  .flow-node{padding:8px 14px; border-radius:10px; background:var(--glass); border:1px solid var(--border);
    font-size:0.82rem; opacity:0; transform:translateY(8px); animation:flowIn .4s forwards;}
  .flow-arrow{color:var(--accent); font-size:1.1rem; opacity:0; animation:flowIn .4s forwards;}
  @keyframes flowIn{to{opacity:1; transform:translateY(0);}}
  .multi-hint{color:var(--sub); font-size:0.85rem; text-align:center; margin-bottom:10px;}
  .role-card.selected{border-color:var(--good); background:rgba(91,227,164,0.12);}
  .role-card.selected .rname{color:var(--good);}
  .selected-count{text-align:center; color:var(--accent); font-size:0.85rem; margin-top:6px;}
  .results-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin:24px 0;}
  @media (max-width:640px){.results-grid{grid-template-columns:1fr;}}
  .chart-box{background:var(--glass); border:1px solid var(--border); border-radius:14px; padding:18px;}
  .bar-row{display:flex; align-items:center; gap:10px; margin:12px 0;}
  .bar-label{width:110px; font-size:0.8rem; color:var(--sub); flex-shrink:0;}
  .bar-track{flex:1; height:14px; border-radius:8px; background:rgba(255,255,255,0.06); overflow:hidden;}
  .bar-fill{height:100%; border-radius:8px; background:linear-gradient(90deg,var(--accent),var(--accent2));
    width:0%; transition:width 1.2s cubic-bezier(.2,.8,.2,1);}
  .reflect-box{background:var(--glass); border:1px solid var(--border); border-radius:14px; padding:20px; margin-top:16px;}
  .reflect-box h4{color:var(--accent); font-size:0.95rem; margin-bottom:8px;}
  .reflect-box p{color:var(--sub); font-size:0.88rem; line-height:1.5; margin-bottom:14px;}
  .celebration{text-align:center; font-size:2.5rem; margin:10px 0; animation:bounce 1s ease infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  .intro-card{text-align:center; padding:40px 26px;}
  .intro-card .big-emoji{font-size:3rem; margin-bottom:14px;}
  .intro-card p{color:var(--sub); margin:14px 0; line-height:1.6;}
  .hidden{display:none !important;}
  .touch-hint{text-align:center; font-size:0.75rem; color:var(--sub); margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧭 Task Compass</h1>
    <div class="subtitle">Learn how work flows through real organizations.</div>
  </header>

  <div class="progress-wrap" id="progressWrap">
    <div class="stage-dot" data-stage="1">1 · Who Owns This?</div>
    <div class="stage-dot" data-stage="2">2 · Task Routing</div>
    <div class="stage-dot" data-stage="3">3 · Collaboration</div>
  </div>
  <div class="qcount" id="qcount"></div>

  <div id="app"></div>
</div>

<script>
/* ============== DATA (School / University theme) ============== */
const ROLES = [
  {id:'teacher', name:'Teacher', emoji:'👩‍🏫', color:'var(--teacher)'},
  {id:'principal', name:'Principal / Admin', emoji:'🏫', color:'var(--principal)'},
  {id:'it', name:'IT Support', emoji:'💻', color:'var(--it)'},
  {id:'advisor', name:'Academic Advisor', emoji:'📚', color:'var(--advisor)'},
  {id:'affairs', name:'Student Affairs', emoji:'🎓', color:'var(--affairs)'},
  {id:'parent', name:'Parent Coordinator', emoji:'👪', color:'var(--parent)'},
  {id:'curriculum', name:'Curriculum Coordinator', emoji:'📝', color:'var(--curriculum)'},
  {id:'counselor', name:'School Counselor', emoji:'💬', color:'var(--counselor)'}
];
const roleById = id => ROLES.find(r=>r.id===id);

const STAGE1_POOL = [
  {task:"A student's online exam portal keeps logging them out mid-test.", owner:'it',
   why:"Technical login/session failures during exams are IT's responsibility to diagnose and fix — it's a system reliability issue.",
   assist:['teacher','advisor']},
  {task:"A parent complains their child's grades were not updated on time.", owner:'teacher',
   why:"The teacher owns grade entry and is closest to the classroom data, so they resolve the delay directly.",
   assist:['principal','parent']},
  {task:"A student wants to switch from Science to Commerce stream mid-year.", owner:'advisor',
   why:"Stream changes require academic guidance on prerequisites and course planning — the advisor's core job.",
   assist:['curriculum','principal']},
  {task:"Multiple students report bullying in the hallway between classes.", owner:'counselor',
   why:"Bullying involves student wellbeing and behavior, which the counselor is trained to address first.",
   assist:['affairs','principal']},
  {task:"The new semester timetable has overlapping class schedules.", owner:'curriculum',
   why:"Timetable design and course sequencing sit with the curriculum coordinator, who owns the master schedule.",
   assist:['principal','teacher']},
  {task:"A student's extracurricular club needs a budget approval.", owner:'affairs',
   why:"Student Affairs manages clubs, events, and student life budgets as part of their core scope.",
   assist:['principal']},
  {task:"Parents are asking why the school app hasn't sent notifications in a week.", owner:'it',
   why:"App/notification outages are a technical infrastructure issue that IT is responsible for maintaining.",
   assist:['parent','principal']},
  {task:"A teacher wants to update part of the syllabus mid-term.", owner:'curriculum',
   why:"Syllabus content changes must go through the curriculum coordinator to keep standards and pacing consistent.",
   assist:['teacher','principal']},
  {task:"A student is falling behind and considering dropping out.", owner:'counselor',
   why:"At-risk student situations are emotional and academic at once — the counselor leads, coordinating with others.",
   assist:['advisor','parent']},
  {task:"A major donor wants a tour and briefing on school performance.", owner:'principal',
   why:"External relationship management and representing the school's overall performance is the principal's role.",
   assist:['affairs']}
];

const STAGE2_POOL = [
  {task:"A parent emails a complaint about a grading error on their child's report card.",
   order:['parent','teacher','principal'],
   why:"The parent-facing complaint first reaches the Parent Coordinator, who routes it to the Teacher who owns the grade, then Principal signs off on any correction."},
  {task:"A student requests a transcript for a college application deadline this week.",
   order:['advisor','curriculum','principal'],
   why:"The Advisor initiates the request, Curriculum verifies course records, and the Principal provides final sign-off/signature."},
  {task:"The school's online portal crashes right before exam registration closes.",
   order:['it','curriculum','principal','parent'],
   why:"IT fixes the technical issue first, Curriculum adjusts the registration window, Principal approves the extension, and Parents are informed."},
  {task:"A group of students plans a fundraising event for a local cause.",
   order:['affairs','principal','parent'],
   why:"Student Affairs owns event coordination, Principal approves logistics/budget, and Parents are looped in for support and permissions."},
  {task:"A student is showing signs of severe academic stress and anxiety.",
   order:['teacher','counselor','parent','principal'],
   why:"The Teacher notices and flags it, the Counselor assesses and supports the student, Parents are informed, and the Principal is kept aware for follow-up."},
  {task:"A new curriculum standard from the education board must be rolled out.",
   order:['principal','curriculum','teacher'],
   why:"Leadership receives the mandate first, Curriculum designs the implementation plan, and Teachers execute it in classrooms."}
];

const STAGE3_POOL = [
  {task:"Overall student satisfaction scores suddenly drop across the school.",
   primary:'principal', support:['teacher','counselor','affairs'],
   why:"Leadership must investigate the cause and coordinate a response, but understanding it requires classroom, wellbeing and student-life perspectives.",
   flow:"Principal ↔ Teacher ↔ Counselor ↔ Student Affairs"},
  {task:"Enrollment applications increase dramatically for next year.",
   primary:'principal', support:['advisor','it','affairs'],
   why:"Growth needs coordinated capacity planning — advisors handle intake, IT scales systems, and Student Affairs preps orientation.",
   flow:"Principal → Advisor → IT → Student Affairs"},
  {task:"Negative reviews about the school appear on public parent forums.",
   primary:'principal', support:['parent','affairs','teacher'],
   why:"Reputation issues need leadership response plus direct parent communication and classroom-level context.",
   flow:"Principal ↔ Parent Coordinator ↔ Student Affairs ↔ Teacher"},
  {task:"A major curriculum rollout is delayed past the semester start date.",
   primary:'curriculum', support:['principal','teacher','it'],
   why:"Curriculum owns the timeline, but leadership approval, teacher readiness and system updates all affect the delay.",
   flow:"Curriculum → Principal → Teacher → IT"},
  {task:"A wave of students report feeling overwhelmed after exam schedules changed.",
   primary:'counselor', support:['curriculum','teacher','parent'],
   why:"Wellbeing leads the response, but the schedule itself, classroom pacing, and home support all need coordination.",
   flow:"Counselor ↔ Curriculum ↔ Teacher ↔ Parent Coordinator"},
  {task:"A cybersecurity concern is raised about student data on the school app.",
   primary:'it', support:['principal','parent','affairs'],
   why:"IT leads the technical fix, but leadership must be informed, parents reassured, and student-facing services coordinated.",
   flow:"IT → Principal → Parent Coordinator → Student Affairs"}
];

function shuffle(arr){const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;}
function pick(pool,n){return shuffle(pool).slice(0,n);}

/* ============== STATE ============== */
let state = {
  stage:1,
  qIndex:0,
  s1: pick(STAGE1_POOL,3),
  s2: pick(STAGE2_POOL,3),
  s3: pick(STAGE3_POOL,3),
  scores:{ownership:0, delegation:0, collaboration:0, workflow:0},
  maxScores:{ownership:3, delegation:3, collaboration:3, workflow:3},
  overAssignCount:0,
  underCollabCount:0,
  answered:false
};

const app = document.getElementById('app');
const qcount = document.getElementById('qcount');
const dots = document.querySelectorAll('.stage-dot');

function updateProgress(){
  dots.forEach(d=>{
    const s = parseInt(d.dataset.stage);
    d.classList.remove('active','done');
    if(s < state.stage) d.classList.add('done');
    else if(s === state.stage) d.classList.add('active');
  });
  if(state.stage<=3){
    const total = state.stage===1?state.s1.length:state.stage===2?state.s2.length:state.s3.length;
    qcount.textContent = `Question ${state.qIndex+1} of ${total}`;
  } else {
    qcount.textContent = '';
  }
}

/* ============== INTRO ============== */
function renderIntro(){
  app.innerHTML = `
    <div class="card intro-card">
      <div class="big-emoji">🏫</div>
      <h2>Welcome to Task Compass</h2>
      <p>You'll step into a <strong>School / University</strong> and learn how real work moves through an organization — who owns it, who helps, and how it flows from person to person.</p>
      <p>Three stages. Drag, drop, and decide.</p>
      <div class="btn-row"><button onclick="startGame()">Begin Simulation →</button></div>
    </div>`;
}
function startGame(){ state.stage=1; state.qIndex=0; renderStage(); }

/* ============== ROUTER ============== */
function renderStage(){
  updateProgress();
  state.answered=false;
  if(state.stage===1) renderStage1();
  else if(state.stage===2) renderStage2();
  else if(state.stage===3) renderStage3();
  else renderResults();
}

/* ============== STAGE 1 ============== */
function renderStage1(){
  const q = state.s1[state.qIndex];
  app.innerHTML = `
    <div class="card">
      <div class="ticket">
        <div class="ticket-tag">🎫 Incoming Task</div>
        <div class="ticket-text">${q.task}</div>
      </div>
      <div style="text-align:center; color:var(--sub); font-size:0.85rem; margin-bottom:6px;">Drag the role that should <strong>own</strong> this task into the slot below.</div>
      <div class="dropzone" id="ownerZone" ondragover="dzOver(event)" ondragleave="dzLeave(event)" ondrop="dzDrop(event)">
        Drop owner here
      </div>
      <div class="touch-hint">Tip: on touch devices, tap a role then tap the slot.</div>
      <div class="roles-grid" id="rolesGrid"></div>
      <div class="btn-row">
        <button id="submitBtn" disabled onclick="submitStage1()">Submit</button>
      </div>
      <div id="feedbackArea"></div>
    </div>`;
  renderRoleCards('rolesGrid', ROLES, {mode:'single', targetId:'ownerZone'});
}
let stage1Selection = null;
function renderRoleCards(gridId, roles, opts){
  const grid = document.getElementById(gridId);
  grid.innerHTML = roles.map(r=>`
    <div class="role-card" draggable="true" data-role="${r.id}"
      ondragstart="dragStart(event)" onclick="cardClick(event,'${opts.mode}','${opts.targetId||''}')">
      <span class="emoji">${r.emoji}</span>
      <span class="rname">${r.name}</span>
    </div>`).join('');
}
function dragStart(e){ e.dataTransfer.setData('text/plain', e.target.closest('.role-card').dataset.role); e.target.classList.add('dragging'); }
function dzOver(e){ e.preventDefault(); e.currentTarget.classList.add('over'); }
function dzLeave(e){ e.currentTarget.classList.remove('over'); }
function dzDrop(e){
  e.preventDefault(); e.currentTarget.classList.remove('over');
  const roleId = e.dataTransfer.getData('text/plain');
  placeInOwnerZone(roleId);
}
function cardClick(e, mode, targetId){
  if(mode==='single'){
    const roleId = e.currentTarget.dataset.role;
    placeInOwnerZone(roleId);
  }
}
function placeInOwnerZone(roleId){
  stage1Selection = roleId;
  const r = roleById(roleId);
  const zone = document.getElementById('ownerZone');
  zone.innerHTML = `<div class="placed">${r.emoji} ${r.name}</div>`;
  document.getElementById('submitBtn').disabled = false;
}
function submitStage1(){
  if(state.answered || !stage1Selection) return;
  state.answered = true;
  const q = state.s1[state.qIndex];
  const correct = stage1Selection === q.owner;
  state.scores.ownership += correct ? 1 : (q.assist.includes(stage1Selection) ? 0.5 : 0);
  if(!correct && !q.assist.includes(stage1Selection)) state.overAssignCount++;

  const ownerRole = roleById(q.owner);
  const chosenRole = roleById(stage1Selection);
  const assistNames = q.assist.map(a=>roleById(a).name).join(', ');

  document.getElementById('feedbackArea').innerHTML = `
    <div class="feedback">
      <h3>${correct ? '✓ Primary Owner Confirmed' : '↺ Let us look at the ownership here'}</h3>
      <p><strong>Primary Owner:</strong> ${ownerRole.emoji} ${ownerRole.name}${correct ? ' — that is exactly who you chose!' : ' (you chose ' + chosenRole.emoji + ' ' + chosenRole.name + ')'}</p>
      <p><strong>Why:</strong> ${q.why}</p>
      <p class="assist"><strong>May assist:</strong> ${assistNames}</p>
    </div>`;
  document.getElementById('submitBtn').outerHTML = `<button onclick="nextQuestion()">Continue →</button>`;
}
function nextQuestion(){
  state.qIndex++;
  const total = state.stage===1?state.s1.length:state.stage===2?state.s2.length:state.s3.length;
  if(state.qIndex >= total){
    state.stage++; state.qIndex=0;
    stage1Selection=null;
  }
  renderStage();
}

/* ============== STAGE 2 ============== */
let stage2Order = [];
function renderStage2(){
  stage2Order = [];
  const q = state.s2[state.qIndex];
  const steps = q.order.length;
  app.innerHTML = `
    <div class="card">
      <div class="ticket">
        <div class="ticket-tag">🎫 Incoming Task</div>
        <div class="ticket-text">${q.task}</div>
      </div>
      <div style="text-align:center; color:var(--sub); font-size:0.85rem; margin-bottom:6px;">Build the workflow: drag roles into order (${steps} steps).</div>
      <div class="order-list" id="orderList"></div>
      <div class="touch-hint">Tip: on touch devices, tap a role then tap the next empty step.</div>
      <div class="roles-grid" id="rolesGrid2"></div>
      <div class="btn-row">
        <button id="submitBtn2" disabled onclick="submitStage2()">Submit</button>
      </div>
      <div id="feedbackArea2"></div>
      <div id="flowAnimArea"></div>
    </div>`;
  const list = document.getElementById('orderList');
  list.innerHTML = '';
  for(let i=0;i<steps;i++){
    const slot = document.createElement('div');
    slot.className='order-slot';
    slot.dataset.index = i;
    slot.ondragover = ozOver; slot.ondragleave = ozLeave; slot.ondrop = ozDrop;
    slot.onclick = ()=>slotClick(i);
    slot.innerHTML = `<span class="step-num">${i+1}</span><span class="slot-content" style="color:var(--sub); font-size:0.8rem;">Drop role here</span>`;
    list.appendChild(slot);
  }
  renderRoleCards2('rolesGrid2', shuffle(q.order.map(id=>roleById(id))));
}
let selectedRoleForOrder = null;
function renderRoleCards2(gridId, roles){
  const grid = document.getElementById(gridId);
  grid.innerHTML = roles.map(r=>`
    <div class="role-card" draggable="true" data-role="${r.id}"
      ondragstart="dragStart2(event)" onclick="roleTapSelect(event)">
      <span class="emoji">${r.emoji}</span>
      <span class="rname">${r.name}</span>
    </div>`).join('');
}
function dragStart2(e){ e.dataTransfer.setData('text/plain', e.target.closest('.role-card').dataset.role); }
function roleTapSelect(e){
  document.querySelectorAll('#rolesGrid2 .role-card').forEach(c=>c.classList.remove('selected'));
  const card = e.currentTarget;
  card.classList.add('selected');
  selectedRoleForOrder = card.dataset.role;
}
function slotClick(i){
  if(!selectedRoleForOrder) return;
  fillSlot(i, selectedRoleForOrder);
  const card = document.querySelector(`#rolesGrid2 .role-card[data-role="${selectedRoleForOrder}"]`);
  if(card) card.style.display='none';
  selectedRoleForOrder = null;
}
function ozOver(e){ e.preventDefault(); e.currentTarget.classList.add('over'); }
function ozLeave(e){ e.currentTarget.classList.remove('over'); }
function ozDrop(e){
  e.preventDefault(); e.currentTarget.classList.remove('over');
  const roleId = e.dataTransfer.getData('text/plain');
  const idx = parseInt(e.currentTarget.dataset.index);
  fillSlot(idx, roleId);
  const card = document.querySelector(`#rolesGrid2 .role-card[data-role="${roleId}"]`);
  if(card) card.style.display='none';
}
function fillSlot(idx, roleId){
  const r = roleById(roleId);
  stage2Order[idx] = roleId;
  const slot = document.querySelectorAll('#orderList .order-slot')[idx];
  slot.innerHTML = `<span class="step-num">${idx+1}</span><div class="placed">${r.emoji} ${r.name}</div>`;
  const q = state.s2[state.qIndex];
  const filled = stage2Order.filter(x=>x).length;
  document.getElementById('submitBtn2').disabled = filled < q.order.length;
}
function submitStage2(){
  if(state.answered) return;
  state.answered = true;
  const q = state.s2[state.qIndex];
  let correctCount = 0;
  q.order.forEach((id,i)=>{ if(stage2Order[i]===id) correctCount++; });
  const fullCorrect = correctCount === q.order.length;
  state.scores.workflow += fullCorrect ? 1 : correctCount/q.order.length;
  state.scores.delegation += fullCorrect ? 1 : 0.5;

  document.getElementById('feedbackArea2').innerHTML = `
    <div class="feedback">
      <h3>${fullCorrect ? '✓ Perfect workflow!' : '↺ Here is the typical flow'}</h3>
      <p><strong>Why this order:</strong> ${q.why}</p>
    </div>`;

  const flowArea = document.getElementById('flowAnimArea');
  let html = '<div class="flow-anim">';
  q.order.forEach((id,i)=>{
    const r = roleById(id);
    html += `<div class="flow-node" style="animation-delay:${i*0.35}s; border-color:${r.color};">${r.emoji} ${r.name}</div>`;
    if(i < q.order.length-1) html += `<div class="flow-arrow" style="animation-delay:${i*0.35+0.15}s;">→</div>`;
  });
  html += '</div>';
  flowArea.innerHTML = html;

  document.getElementById('submitBtn2').outerHTML = `<button onclick="nextQuestion()">Continue →</button>`;
}

/* ============== STAGE 3 ============== */
let stage3Selected = [];
function renderStage3(){
  stage3Selected = [];
  const q = state.s3[state.qIndex];
  app.innerHTML = `
    <div class="card">
      <div class="ticket">
        <div class="ticket-tag">🎫 Organizational Situation</div>
        <div class="ticket-text">${q.task}</div>
      </div>
      <div class="multi-hint">Select up to 4 departments/roles that should be involved.</div>
      <div class="roles-grid" id="rolesGrid3"></div>
      <div class="selected-count" id="selCount">0 selected</div>
      <div class="btn-row">
        <button id="submitBtn3" disabled onclick="submitStage3()">Submit</button>
      </div>
      <div id="feedbackArea3"></div>
    </div>`;
  const grid = document.getElementById('rolesGrid3');
  grid.innerHTML = ROLES.map(r=>`
    <div class="role-card" data-role="${r.id}" onclick="toggleStage3Role('${r.id}')">
      <span class="emoji">${r.emoji}</span>
      <span class="rname">${r.name}</span>
    </div>`).join('');
}
function toggleStage3Role(roleId){
  const card = document.querySelector(`#rolesGrid3 .role-card[data-role="${roleId}"]`);
  const idx = stage3Selected.indexOf(roleId);
  if(idx>-1){
    stage3Selected.splice(idx,1); card.classList.remove('selected');
  } else {
    if(stage3Selected.length>=4) return;
    stage3Selected.push(roleId); card.classList.add('selected');
  }
  document.getElementById('selCount').textContent = `${stage3Selected.length} selected (max 4)`;
  document.getElementById('submitBtn3').disabled = stage3Selected.length===0;
}
function submitStage3(){
  if(state.answered) return;
  state.answered = true;
  const q = state.s3[state.qIndex];
  const idealSet = new Set([q.primary, ...q.support]);
  const chosenSet = new Set(stage3Selected);
  let overlap = 0;
  chosenSet.forEach(id=>{ if(idealSet.has(id)) overlap++; });
  const gotPrimary = chosenSet.has(q.primary);
  const collabScore = overlap / idealSet.size;
  state.scores.collaboration += collabScore;
  state.scores.ownership += gotPrimary ? 0.5 : 0;
  if(chosenSet.size <= 1) state.underCollabCount++;

  const primaryRole = roleById(q.primary);
  const supportNames = q.support.map(id=>roleById(id).name).join(', ');

  document.getElementById('feedbackArea3').innerHTML = `
    <div class="feedback">
      <h3>📋 Situation Breakdown</h3>
      <p><strong>Primary Owner:</strong> ${primaryRole.emoji} ${primaryRole.name}</p>
      <p><strong>Supporting Teams:</strong> ${supportNames}</p>
      <p><strong>Reasoning:</strong> ${q.why}</p>
      <p class="assist"><strong>Possible Communication Flow:</strong> ${q.flow}</p>
    </div>`;
  document.getElementById('submitBtn3').outerHTML = `<button onclick="nextQuestion()">Continue →</button>`;
}

/* ============== RESULTS ============== */
function renderResults(){
  updateProgress();
  const pct = k => Math.round((state.scores[k]/state.maxScores[k])*100);
  const cats = [
    {key:'ownership', label:'Ownership', emoji:'🎯'},
    {key:'delegation', label:'Delegation', emoji:'🤝'},
    {key:'collaboration', label:'Collaboration', emoji:'👥'},
    {key:'workflow', label:'Workflow Thinking', emoji:'🔄'}
  ];
  app.innerHTML = `
    <div class="card">
      <div class="celebration">🎉</div>
      <h2 style="text-align:center;">Simulation Complete!</h2>
      <p style="text-align:center; color:var(--sub); margin-top:8px;">Here's how your organizational thinking shaped up.</p>
      <div class="chart-box" style="margin-top:24px;">
        ${cats.map(c=>`
          <div class="bar-row">
            <div class="bar-label">${c.emoji} ${c.label}</div>
            <div class="bar-track"><div class="bar-fill" id="bar-${c.key}"></div></div>
            <div style="width:42px; text-align:right; font-size:0.8rem; color:var(--sub);" id="pct-${c.key}"></div>
          </div>`).join('')}
      </div>

      <div class="reflect-box">
        <h4>✅ What you understood well</h4>
        <p>${strongestArea(cats,pct)}</p>
        <h4>⚠️ Where you tended to over-assign responsibility</h4>
        <p>${state.overAssignCount>0
            ? `In some tasks, you assigned ownership to a role that was more of a supporting player than the primary owner (${state.overAssignCount} time${state.overAssignCount>1?'s':''}). This is common — it often means you're thinking about who's affected, not just who's accountable.`
            : `You generally stayed close to the actual primary owner across tasks — a good sign of clear accountability thinking.`}</p>
        <h4>🔍 Where you underestimated collaboration</h4>
        <p>${state.underCollabCount>0
            ? `In a few larger situations, you selected only one role when the scenario likely called for a broader team response. Complex problems rarely have a single owner.`
            : `You tended to bring in multiple roles for complex situations, which reflects realistic organizational thinking.`}</p>
        <h4>💡 One insight</h4>
        <p>Many real workplace problems — in schools and elsewhere — are solved by teams coordinating together rather than any single person acting alone. Ownership matters, but it usually works best paired with clear communication across roles.</p>
      </div>

      <div class="btn-row">
        <button class="secondary" onclick="restartGame()">🔁 Play Again</button>
      </div>
    </div>`;

  setTimeout(()=>{
    cats.forEach(c=>{
      const p = pct(c.key);
      document.getElementById(`bar-${c.key}`).style.width = p+'%';
      document.getElementById(`pct-${c.key}`).textContent = p+'%';
    });
  }, 150);
}
function strongestArea(cats,pct){
  let best = cats[0], bestVal=-1;
  cats.forEach(c=>{ const v=pct(c.key); if(v>bestVal){bestVal=v; best=c;} });
  return `Your strongest area was <strong>${best.label}</strong> (${bestVal}%). You showed a solid instinct for ${best.key==='ownership'?'identifying who is truly accountable for a task':best.key==='delegation'?'routing work to the right next step':best.key==='collaboration'?'recognizing when multiple teams need to be involved':'sequencing work logically through an organization'}.`;
}
function restartGame(){
  state = {
    stage:1, qIndex:0,
    s1: pick(STAGE1_POOL,3), s2: pick(STAGE2_POOL,3), s3: pick(STAGE3_POOL,3),
    scores:{ownership:0, delegation:0, collaboration:0, workflow:0},
    maxScores:{ownership:3, delegation:3, collaboration:3, workflow:3},
    overAssignCount:0, underCollabCount:0, answered:false
  };
  renderIntro();
}

renderIntro();
</script>
</body>
</html>
