<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Defend Your Experience — Cross-Examination Transcript</title>
<style>
:root{
  --ink-0:#0a0c0f;
  --ink-1:#12151a;
  --ink-2:#1a1e25;
  --ink-3:#262b34;
  --line:#2c323c;
  --text-0:#e9e6df;
  --text-1:#a9aeb8;
  --text-2:#6b7280;
  --gold:#c9a227;
  --gold-soft:#e8c96a;
  --sourced:#4ade80;
  --estimated:#f5a623;
  --unverified:#f0546b;
  --shaky:#f0546b;
  --solid:#4ade80;
  --serif:'Fraunces', Georgia, serif;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
}
@font-face{font-family:'Fraunces';src:local('Georgia');}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:
    radial-gradient(ellipse 1200px 600px at 15% -10%, rgba(201,162,39,0.06), transparent),
    radial-gradient(ellipse 900px 500px at 100% 100%, rgba(240,84,107,0.04), transparent),
    var(--ink-0);
  color:var(--text-0);
  font-family:var(--sans);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--gold);color:#0a0c0f;}
@media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important;transition-duration:0.01ms !important;}}

/* ---------- Scaffold ---------- */
.app{display:flex;flex-direction:column;min-height:100vh;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 28px;border-bottom:1px solid var(--line);
  background:rgba(18,21,26,0.7);backdrop-filter:blur(10px);
  position:sticky;top:0;z-index:50;
}
.brand{display:flex;align-items:baseline;gap:10px;}
.brand .stamp-mini{
  font-family:var(--mono);font-size:10px;letter-spacing:0.14em;
  color:var(--ink-0);background:var(--gold);padding:2px 6px;border-radius:3px;
  transform:rotate(-3deg);font-weight:700;
}
.brand h1{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:0.01em;}
.brand h1 em{font-style:italic;color:var(--gold-soft);}
.topbar-right{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:11px;color:var(--text-2);}
.session-pill{border:1px solid var(--line);border-radius:20px;padding:5px 12px;cursor:pointer;transition:.2s;background:transparent;color:var(--text-1);}
.session-pill:hover{border-color:var(--gold);color:var(--gold-soft);}

.stage{flex:1;display:flex;justify-content:center;padding:0;}
.container{width:100%;max-width:1180px;padding:32px 28px 80px;}

/* ---------- Landing / Onboarding ---------- */
.landing{max-width:760px;margin:40px auto;text-align:left;}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:0.18em;color:var(--gold);text-transform:uppercase;margin-bottom:18px;display:flex;align-items:center;gap:10px;}
.eyebrow::before{content:'';width:22px;height:1px;background:var(--gold);display:inline-block;}
.landing h2{font-family:var(--serif);font-size:44px;line-height:1.12;font-weight:600;margin-bottom:18px;letter-spacing:-0.01em;}
.landing h2 em{font-style:italic;color:var(--gold-soft);}
.landing p.lead{font-size:16px;color:var(--text-1);line-height:1.65;max-width:600px;margin-bottom:34px;}

.dropzone{
  border:1.5px dashed var(--line);border-radius:10px;padding:36px 28px;
  background:var(--ink-1);cursor:pointer;transition:.2s;text-align:center;margin-bottom:18px;
}
.dropzone.drag{border-color:var(--gold);background:rgba(201,162,39,0.06);}
.dropzone .dz-icon{font-family:var(--mono);font-size:26px;color:var(--gold);margin-bottom:10px;}
.dropzone h3{font-family:var(--serif);font-size:17px;margin-bottom:6px;}
.dropzone p{font-size:13px;color:var(--text-2);}
.dropzone input{display:none;}

.or-divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--text-2);font-family:var(--mono);font-size:10px;letter-spacing:.12em;}
.or-divider::before,.or-divider::after{content:'';flex:1;height:1px;background:var(--line);}

textarea.paste-area{
  width:100%;min-height:150px;background:var(--ink-1);border:1px solid var(--line);
  border-radius:10px;color:var(--text-0);padding:16px;font-family:var(--sans);font-size:14px;
  line-height:1.6;resize:vertical;outline:none;transition:.2s;
}
textarea.paste-area:focus{border-color:var(--gold);}
textarea.paste-area::placeholder{color:var(--text-2);}

.file-chip{display:inline-flex;align-items:center;gap:8px;background:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-family:var(--mono);font-size:12px;margin-bottom:14px;}
.file-chip button{background:none;border:none;color:var(--unverified);cursor:pointer;font-size:14px;}

.btn{
  font-family:var(--sans);font-weight:600;font-size:14px;padding:13px 26px;border-radius:8px;
  border:1px solid var(--gold);background:var(--gold);color:#0a0c0f;cursor:pointer;transition:.2s;
  display:inline-flex;align-items:center;gap:8px;
}
.btn:hover{background:var(--gold-soft);border-color:var(--gold-soft);transform:translateY(-1px);}
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
.btn.ghost{background:transparent;color:var(--text-1);border-color:var(--line);}
.btn.ghost:hover{border-color:var(--text-1);color:var(--text-0);}
.btn.small{padding:8px 14px;font-size:12px;}

.audience-row{display:flex;gap:10px;margin:22px 0;flex-wrap:wrap;}
.opt-card{
  flex:1;min-width:150px;border:1px solid var(--line);background:var(--ink-1);border-radius:10px;
  padding:14px 16px;cursor:pointer;transition:.15s;
}
.opt-card:hover{border-color:var(--gold-soft);}
.opt-card.selected{border-color:var(--gold);background:rgba(201,162,39,0.08);}
.opt-card .oc-label{font-weight:600;font-size:13px;margin-bottom:2px;}
.opt-card .oc-sub{font-size:11px;color:var(--text-2);}

.hist-list{margin-top:30px;}
.hist-list h4{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--text-2);text-transform:uppercase;margin-bottom:12px;}
.hist-item{
  display:flex;justify-content:space-between;align-items:center;padding:12px 14px;
  border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:.15s;background:var(--ink-1);
}
.hist-item:hover{border-color:var(--gold-soft);}
.hist-item .hi-title{font-size:13px;font-weight:500;}
.hist-item .hi-meta{font-family:var(--mono);font-size:10px;color:var(--text-2);margin-top:2px;}

/* ---------- Interview layout ---------- */
.interview{display:grid;grid-template-columns:260px 1fr 250px;gap:24px;align-items:start;}
@media (max-width:980px){.interview{grid-template-columns:1fr;}}

.docket{position:sticky;top:80px;}
.docket h4,.gauge-panel h4{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--text-2);text-transform:uppercase;margin-bottom:14px;}
.claim-item{
  padding:11px 12px;border-radius:8px;border:1px solid var(--line);margin-bottom:8px;cursor:default;
  background:var(--ink-1);transition:.2s;
}
.claim-item.active{border-color:var(--gold);background:rgba(201,162,39,0.07);}
.claim-item .ci-text{font-size:12.5px;line-height:1.4;color:var(--text-0);margin-bottom:6px;}
.stamp{
  display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.08em;
  padding:2px 7px;border-radius:3px;text-transform:uppercase;transform:rotate(-2deg);border:1px solid currentColor;
}
.stamp.sourced,.stamp.solid{color:var(--sourced);}
.stamp.estimated{color:var(--estimated);}
.stamp.unverified,.stamp.shaky{color:var(--unverified);}
.stamp.pending{color:var(--text-2);}

.transcript-panel{background:var(--ink-1);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:520px;display:flex;flex-direction:column;}
.transcript-head{
  padding:16px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
  background:var(--ink-2);
}
.transcript-head .th-title{font-family:var(--serif);font-size:15px;}
.transcript-head .th-case{font-family:var(--mono);font-size:10px;color:var(--text-2);}
.progress-bar{height:3px;background:var(--ink-3);position:relative;}
.progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-soft));transition:width .4s ease;}

.transcript-body{flex:1;padding:22px 26px;overflow-y:auto;max-height:560px;}
.line{display:flex;gap:14px;margin-bottom:22px;animation:fadeUp .35s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.line-no{font-family:var(--mono);font-size:11px;color:var(--text-2);padding-top:3px;min-width:24px;text-align:right;}
.line-content{flex:1;}
.speaker{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;display:flex;align-items:center;gap:8px;}
.speaker.examiner{color:var(--unverified);}
.speaker.you{color:var(--gold-soft);}
.bubble{font-size:14.5px;line-height:1.65;color:var(--text-0);}
.bubble.examiner-text{font-family:var(--serif);font-style:italic;font-size:16px;color:#f2ded6;}
.evidence-tag{margin-top:8px;}

.typing-dots{display:inline-flex;gap:4px;padding:4px 0;}
.typing-dots span{width:5px;height:5px;background:var(--text-2);border-radius:50%;animation:blink 1.2s infinite ease-in-out;}
.typing-dots span:nth-child(2){animation-delay:.2s;}
.typing-dots span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}

.answer-zone{border-top:1px solid var(--line);padding:18px 22px;background:var(--ink-2);}
textarea.answer-input{
  width:100%;min-height:88px;background:var(--ink-0);border:1px solid var(--line);border-radius:8px;
  color:var(--text-0);padding:12px 14px;font-family:var(--sans);font-size:14px;line-height:1.55;resize:vertical;outline:none;
}
textarea.answer-input:focus{border-color:var(--gold);}
.answer-controls{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
.char-hint{font-family:var(--mono);font-size:10px;color:var(--text-2);}

.gauge-panel{position:sticky;top:80px;}
.gauge-card{background:var(--ink-1);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px;}
.gauge-ring{width:120px;height:120px;margin:0 auto 14px;position:relative;}
.gauge-ring svg{transform:rotate(-90deg);}
.gauge-ring .g-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:26px;font-weight:600;}
.gauge-label{text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--text-2);text-transform:uppercase;}
.legend{display:flex;flex-direction:column;gap:8px;margin-top:14px;font-size:11.5px;}
.legend-row{display:flex;justify-content:space-between;align-items:center;color:var(--text-1);}
.legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}

.finish-cta{width:100%;margin-top:8px;}

/* ---------- Empty/error states ---------- */
.notice{
  border:1px solid var(--line);background:var(--ink-1);border-radius:8px;padding:12px 16px;
  font-size:12.5px;color:var(--text-1);display:flex;gap:10px;align-items:flex-start;margin-bottom:16px;
}
.notice.error{border-color:rgba(240,84,107,0.4);color:#f4b6c1;}
.notice .n-icon{font-family:var(--mono);color:var(--unverified);}

/* ---------- Report ---------- */
.report-hero{text-align:center;margin-bottom:34px;}
.report-hero .eyebrow{justify-content:center;}
.report-hero h2{font-family:var(--serif);font-size:38px;margin-bottom:10px;}
.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:30px;}
@media (max-width:760px){.report-grid{grid-template-columns:1fr;}}
.report-stat{background:var(--ink-1);border:1px solid var(--line);border-radius:12px;padding:20px;text-align:center;}
.report-stat .rs-num{font-family:var(--serif);font-size:34px;color:var(--gold-soft);}
.report-stat .rs-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--text-2);text-transform:uppercase;margin-top:6px;}

.claim-report{background:var(--ink-1);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:14px;}
.cr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;}
.cr-claim{font-family:var(--serif);font-size:15px;line-height:1.5;flex:1;}
.cr-body{font-size:13px;color:var(--text-1);line-height:1.6;}
.cr-body strong{color:var(--text-0);}
.cr-section{margin-top:10px;}
.cr-section-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--text-2);text-transform:uppercase;margin-bottom:4px;}

.report-actions{display:flex;gap:12px;justify-content:center;margin-top:30px;flex-wrap:wrap;}

/* scrollbar */
.transcript-body::-webkit-scrollbar{width:6px;}
.transcript-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

@media (max-width:640px){
  .landing h2{font-size:32px;}
  .container{padding:22px 16px 60px;}
  .report-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <span class="stamp-mini">EXHIBIT A</span>
      <h1>Defend Your <em>Experience</em></h1>
    </div>
    <div class="topbar-right">
      <span id="sessionMeta"></span>
      <button class="session-pill" id="newSessionBtn">+ New session</button>
    </div>
  </div>

  <div class="stage"><div class="container" id="container"></div></div>
</div>

<script>
/* ============================================================
   STATE
============================================================ */
const LS_SESSIONS = 'dye_sessions_v1';
const LS_CURRENT = 'dye_current_v1';

let state = {
  id: null,
  createdAt: null,
  sourceText: '',
  audience: null,
  claims: [],        // {id, text, stamp, evidence, transcript:[{role,text}], resolved}
  activeClaimIdx: 0,
  phase: 'landing',   // landing | extracting | interview | report
  uploadedFileName: null
};

function uid(){ return 'c_' + Math.random().toString(36).slice(2,9); }

function saveCurrent(){
  try{ localStorage.setItem(LS_CURRENT, JSON.stringify(state)); }catch(e){}
}
function loadCurrent(){
  try{
    const raw = localStorage.getItem(LS_CURRENT);
    if(raw){ const s = JSON.parse(raw); if(s && s.phase && s.phase!=='landing') return s; }
  }catch(e){}
  return null;
}
function archiveSession(){
  try{
    const raw = localStorage.getItem(LS_SESSIONS);
    let list = raw ? JSON.parse(raw) : [];
    list = list.filter(s=>s.id!==state.id);
    list.unshift({
      id: state.id, createdAt: state.createdAt, audience: state.audience,
      claimCount: state.claims.length, snapshot: state
    });
    list = list.slice(0,12);
    localStorage.setItem(LS_SESSIONS, JSON.stringify(list));
  }catch(e){}
}
function getSessions(){
  try{ const raw = localStorage.getItem(LS_SESSIONS); return raw ? JSON.parse(raw) : []; }catch(e){ return []; }
}

/* ============================================================
   API — Anthropic Messages
============================================================ */
async function callClaude(systemPrompt, userPrompt, retries=2){
  for(let attempt=0; attempt<=retries; attempt++){
    try{
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          model:"claude-sonnet-4-6",
          max_tokens:1000,
          system: systemPrompt,
          messages:[{role:"user", content:userPrompt}]
        })
      });
      if(res.status===429 || res.status===529){
        if(attempt<retries){ await new Promise(r=>setTimeout(r, 900*(attempt+1))); continue; }
        throw new Error('rate_limited');
      }
      if(!res.ok){ throw new Error('api_error_'+res.status); }
      const data = await res.json();
      const textBlocks = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text);
      return textBlocks.join('\n').trim();
    }catch(err){
      if(attempt>=retries) throw err;
      await new Promise(r=>setTimeout(r, 700*(attempt+1)));
    }
  }
}

function extractJson(raw){
  if(!raw) throw new Error('empty');
  let t = raw.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  const start = t.indexOf('{'); const startArr = t.indexOf('[');
  let s = start===-1 ? startArr : (startArr===-1 ? start : Math.min(start,startArr));
  const endObj = t.lastIndexOf('}'); const endArr = t.lastIndexOf(']');
  let e = Math.max(endObj,endArr);
  if(s>-1 && e>-1) t = t.slice(s,e+1);
  return JSON.parse(t);
}

/* ============================================================
   RENDER ROOT
============================================================ */
function render(){
  saveCurrent();
  const c = document.getElementById('container');
  document.getElementById('sessionMeta').textContent = state.phase==='landing' ? '' :
    ('Case #' + (state.id||'').slice(-5).toUpperCase());
  if(state.phase==='landing') return renderLanding(c);
  if(state.phase==='extracting') return renderExtracting(c);
  if(state.phase==='interview') return renderInterview(c);
  if(state.phase==='report') return renderReport(c);
}

/* ============================================================
   LANDING
============================================================ */
function renderLanding(c){
  const sessions = getSessions();
  c.innerHTML = `
    <div class="landing">
      <div class="eyebrow">Cross-examination prep</div>
      <h2>Every claim you make<br>about your work will<br>be <em>challenged.</em></h2>
      <p class="lead">This isn't a resume tool. Paste or upload what you're preparing to defend — a project, a paper, a pitch, a review — and a skeptical interviewer will dig into every claim until you can defend it without flinching.</p>

      <div class="dropzone" id="dropzone">
        <div class="dz-icon">⌥</div>
        <h3>Drop a file, or click to upload</h3>
        <p>.txt, .md — pasted text works just as well</p>
        <input type="file" id="fileInput" accept=".txt,.md,.rtf">
      </div>
      <div id="fileChipHolder"></div>

      <div class="or-divider">OR PASTE / TYPE DIRECTLY</div>
      <textarea class="paste-area" id="pasteArea" placeholder="Describe the project, research, review, or pitch you need to defend. Include the claims you'd actually say out loud — the more specific, the sharper the questions will be.">${escapeHtml(state.sourceText)}</textarea>

      <div style="margin-top:22px;">
        <div class="eyebrow" style="margin-bottom:10px;">Who's asking the questions?</div>
        <div class="audience-row" id="audienceRow">
          ${audienceOptions.map(a=>`
            <div class="opt-card ${state.audience===a.id?'selected':''}" data-aid="${a.id}">
              <div class="oc-label">${a.label}</div>
              <div class="oc-sub">${a.sub}</div>
            </div>`).join('')}
        </div>
      </div>

      <div id="landingError"></div>
      <button class="btn" id="startBtn" style="margin-top:8px;">Begin cross-examination →</button>

      ${sessions.length ? `
        <div class="hist-list">
          <h4>Resume a previous session</h4>
          ${sessions.map(s=>`
            <div class="hist-item" data-sid="${s.id}">
              <div>
                <div class="hi-title">${s.claimCount} claim${s.claimCount===1?'':'s'} under review</div>
                <div class="hi-meta">${new Date(s.createdAt).toLocaleString()} · ${s.audience||'general'}</div>
              </div>
              <button class="btn ghost small" data-resume="${s.id}">Resume</button>
            </div>`).join('')}
        </div>` : ''}
    </div>
  `;

  const dz = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  dz.addEventListener('click', ()=>fileInput.click());
  ['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag');}));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag');}));
  dz.addEventListener('drop', e=>{
    const f = e.dataTransfer.files[0];
    if(f) handleFile(f);
  });
  fileInput.addEventListener('change', e=>{
    const f = e.target.files[0];
    if(f) handleFile(f);
  });

  document.getElementById('pasteArea').addEventListener('input', e=>{
    state.sourceText = e.target.value;
  });

  document.querySelectorAll('#audienceRow .opt-card').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.audience = el.dataset.aid;
      document.querySelectorAll('#audienceRow .opt-card').forEach(x=>x.classList.remove('selected'));
      el.classList.add('selected');
    });
  });

  document.getElementById('startBtn').addEventListener('click', beginExtraction);

  document.querySelectorAll('[data-resume]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const sid = btn.dataset.resume;
      const sess = sessions.find(s=>s.id===sid);
      if(sess){ state = sess.snapshot; render(); }
    });
  });

  renderFileChip();
}

const audienceOptions = [
  {id:'journalist', label:'Journalist / public', sub:'Skeptical of hype, wants plain language'},
  {id:'panel', label:'Expert panel', sub:'Digs into methodology and evidence'},
  {id:'investor', label:'Investor / evaluator', sub:'Tests viability and risk'},
  {id:'manager', label:'Hiring manager', sub:'Probes your actual role and impact'}
];

function renderFileChip(){
  const holder = document.getElementById('fileChipHolder');
  if(!holder) return;
  holder.innerHTML = state.uploadedFileName ? `
    <div class="file-chip">📄 ${escapeHtml(state.uploadedFileName)}
      <button id="clearFile">✕</button>
    </div>` : '';
  const clearBtn = document.getElementById('clearFile');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{
    state.uploadedFileName=null; state.sourceText=''; render();
  });
}

function handleFile(f){
  const reader = new FileReader();
  reader.onload = e=>{
    state.sourceText = e.target.result;
    state.uploadedFileName = f.name;
    render();
  };
  reader.onerror = ()=>{
    alert('Could not read that file — try pasting the text instead.');
  };
  reader.readAsText(f);
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ============================================================
   EXTRACTION (claim identification)
============================================================ */
async function beginExtraction(){
  const errEl = document.getElementById('landingError');
  errEl.innerHTML = '';
  if(!state.sourceText || state.sourceText.trim().length < 20){
    errEl.innerHTML = `<div class="notice error"><span class="n-icon">!</span> Give me at least a few sentences to work with — a single line isn't enough to build real questions from.</div>`;
    return;
  }
  if(!state.audience){
    errEl.innerHTML = `<div class="notice error"><span class="n-icon">!</span> Pick who you're defending this to — it changes what "holds up" means.</div>`;
    return;
  }
  state.id = uid();
  state.createdAt = Date.now();
  state.phase = 'extracting';
  render();

  const sys = `You are a skeptical, expert cross-examiner preparing someone to defend their work. Extract the meaningful, checkable CLAIMS from the text they give you — statements of fact, impact, methodology, causality, originality, or scale that a skeptical audience would want evidence for. Ignore filler. Each claim should be something a person could be pushed to defend, not a vague theme.

Return ONLY valid JSON, no prose, no markdown fences, in this exact shape:
{"claims":[{"text":"the specific claim, in the person's own terms, one sentence"}]}

Extract between 3 and 7 claims. Prioritize the claims that are most load-bearing, most likely to be challenged, or vaguest as written.`;

  const userPrompt = `Audience they will face: ${state.audience}\n\nSource text:\n"""\n${state.sourceText}\n"""`;

  try{
    const raw = await callClaude(sys, userPrompt);
    const parsed = extractJson(raw);
    let claims = (parsed.claims||[]).slice(0,7);
    if(!claims.length) throw new Error('no_claims');
    state.claims = claims.map(cl=>({
      id: uid(),
      text: cl.text,
      stamp: 'pending',
      evidence: '',
      transcript: [],
      resolved: false,
      weaknessNote: ''
    }));
    state.activeClaimIdx = 0;
    state.phase = 'interview';
    render();
    askNextQuestion(true);
  }catch(err){
    renderExtractionError(err);
  }
}

function renderExtractionError(err){
  const c = document.getElementById('container');
  c.innerHTML = `
    <div class="landing">
      <div class="eyebrow">Extraction interrupted</div>
      <h2>The examiner hit a snag.</h2>
      <div class="notice error"><span class="n-icon">!</span>
        ${err && err.message==='rate_limited' ? "The API is rate-limited right now. Wait a few seconds and try again." : "Couldn't parse claims from that text. Try adding a bit more detail, or simplify the wording."}
      </div>
      <button class="btn" id="retryExtract">Try again</button>
      <button class="btn ghost" id="backLanding" style="margin-left:10px;">Back</button>
    </div>`;
  document.getElementById('retryExtract').addEventListener('click', beginExtraction);
  document.getElementById('backLanding').addEventListener('click', ()=>{ state.phase='landing'; render(); });
}

function renderExtracting(c){
  c.innerHTML = `
    <div class="landing">
      <div class="eyebrow">Reviewing your material</div>
      <h2>Reading for what needs<br>to be <em>defended.</em></h2>
      <p class="lead">Pulling out every claim a skeptical ${labelForAudience(state.audience)} would push back on <span class="typing-dots"><span></span><span></span><span></span></span></p>
    </div>`;
}
function labelForAudience(a){
  const found = audienceOptions.find(x=>x.id===a);
  return found ? found.label.toLowerCase() : 'reader';
}

/* ============================================================
   INTERVIEW
============================================================ */
function overallConfidence(){
  if(!state.claims.length) return 0;
  const scores = state.claims.map(c=>{
    if(c.stamp==='solid'||c.stamp==='sourced') return 100;
    if(c.stamp==='estimated') return 55;
    if(c.stamp==='shaky'||c.stamp==='unverified') return 20;
    return 0;
  });
  return Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
}
function resolvedCount(){ return state.claims.filter(c=>c.resolved).length; }

function renderInterview(c){
  const active = state.claims[state.activeClaimIdx];
  const conf = overallConfidence();
  const circumference = 2*Math.PI*50;
  const offset = circumference - (conf/100)*circumference;

  c.innerHTML = `
    <div class="interview">
      <div class="docket">
        <h4>The Docket</h4>
        ${state.claims.map((cl,i)=>`
          <div class="claim-item ${i===state.activeClaimIdx?'active':''}">
            <div class="ci-text">${escapeHtml(cl.text)}</div>
            <span class="stamp ${cl.stamp}">${stampLabel(cl.stamp)}</span>
          </div>
        `).join('')}
      </div>

      <div class="transcript-panel">
        <div class="transcript-head">
          <div>
            <div class="th-title">Claim ${state.activeClaimIdx+1} of ${state.claims.length}</div>
            <div class="th-case">Case #${state.id.slice(-5).toUpperCase()} · Audience: ${labelForAudience(state.audience)}</div>
          </div>
          <span class="stamp ${active.stamp}">${stampLabel(active.stamp)}</span>
        </div>
        <div class="progress-bar"><div class="fill" style="width:${(resolvedCount()/state.claims.length)*100}%"></div></div>
        <div class="transcript-body" id="transcriptBody"></div>
        <div class="answer-zone">
          <textarea class="answer-input" id="answerInput" placeholder="Type your answer as you'd actually say it out loud..."></textarea>
          <div class="answer-controls">
            <span class="char-hint" id="charHint">Be specific — numbers, names, and outcomes hold up better than adjectives.</span>
            <button class="btn small" id="submitAnswer">Submit answer →</button>
          </div>
        </div>
      </div>

      <div class="gauge-panel">
        <div class="gauge-card">
          <div class="gauge-ring">
            <svg width="120" height="120" viewBox="0 0 120 120">
              <circle cx="60" cy="60" r="50" fill="none" stroke="#262b34" stroke-width="9"/>
              <circle cx="60" cy="60" r="50" fill="none" stroke="url(#grad)" stroke-width="9"
                stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
              <defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#c9a227"/><stop offset="100%" stop-color="#e8c96a"/>
              </linearGradient></defs>
            </svg>
            <div class="g-num">${conf}</div>
          </div>
          <div class="gauge-label">Defense confidence</div>
          <div class="legend">
            <div class="legend-row"><span><span class="legend-dot" style="background:var(--sourced)"></span>Solid</span><span>${state.claims.filter(c=>c.stamp==='solid'||c.stamp==='sourced').length}</span></div>
            <div class="legend-row"><span><span class="legend-dot" style="background:var(--estimated)"></span>Estimated</span><span>${state.claims.filter(c=>c.stamp==='estimated').length}</span></div>
            <div class="legend-row"><span><span class="legend-dot" style="background:var(--unverified)"></span>Shaky</span><span>${state.claims.filter(c=>c.stamp==='shaky'||c.stamp==='unverified').length}</span></div>
            <div class="legend-row"><span><span class="legend-dot" style="background:#4a4f58"></span>Pending</span><span>${state.claims.filter(c=>c.stamp==='pending').length}</span></div>
          </div>
        </div>
        <button class="btn ghost finish-cta" id="skipClaim">Skip to next claim →</button>
        <button class="btn finish-cta" id="finishBtn" ${resolvedCount()<state.claims.length?'disabled':''}>Generate Defense Report</button>
      </div>
    </div>
  `;

  renderTranscript(active);

  document.getElementById('submitAnswer').addEventListener('click', submitAnswer);
  document.getElementById('answerInput').addEventListener('keydown', e=>{
    if(e.key==='Enter' && (e.metaKey||e.ctrlKey)) submitAnswer();
  });
  document.getElementById('skipClaim').addEventListener('click', ()=>{
    active.resolved = true;
    if(active.stamp==='pending') active.stamp='estimated';
    advanceClaim();
  });
  document.getElementById('finishBtn').addEventListener('click', ()=>{
    if(resolvedCount()<state.claims.length) return;
    generateReport();
  });
}

function stampLabel(s){
  return {pending:'awaiting review', sourced:'holds up', solid:'holds up', estimated:'needs more', shaky:'shaky', unverified:'shaky'}[s]||s;
}

function renderTranscript(claim){
  const body = document.getElementById('transcriptBody');
  if(!body) return;
  let lineNo = 1;
  body.innerHTML = claim.transcript.map(entry=>{
    const n = lineNo++;
    if(entry.role==='examiner'){
      return `<div class="line"><div class="line-no">${n}</div><div class="line-content">
        <div class="speaker examiner">Examiner</div>
        <div class="bubble examiner-text">${escapeHtml(entry.text)}</div>
      </div></div>`;
    }else{
      return `<div class="line"><div class="line-no">${n}</div><div class="line-content">
        <div class="speaker you">You</div>
        <div class="bubble">${escapeHtml(entry.text)}</div>
      </div></div>`;
    }
  }).join('');
  body.scrollTop = body.scrollHeight;
}

async function askNextQuestion(isOpening){
  const claim = state.claims[state.activeClaimIdx];
  const body = document.getElementById('transcriptBody');
  if(body){
    const n = claim.transcript.length+1;
    body.insertAdjacentHTML('beforeend', `<div class="line" id="thinkingLine"><div class="line-no">${n}</div><div class="line-content">
      <div class="speaker examiner">Examiner</div>
      <div class="bubble examiner-text"><span class="typing-dots"><span></span><span></span><span></span></span></div>
    </div></div>`);
    body.scrollTop = body.scrollHeight;
  }

  const historyText = claim.transcript.map(t=>`${t.role==='examiner'?'Examiner':'Candidate'}: ${t.text}`).join('\n');

  const sys = `You are a sharp, skeptical, but fair examiner cross-examining someone about a specific claim they've made about their own work, in front of ${labelForAudience(state.audience)}. Your job: probe for weak evidence, vague language, unstated assumptions, and gaps between what they claim and what they can actually prove. Be concise (1-3 sentences), conversational, and specific to what they just said — never generic. Reference details from their previous answer where possible. Never be cruel; be rigorous. Ask exactly ONE question.

Return ONLY valid JSON, no markdown fences:
{"question":"the single follow-up question"}`;

  const userPrompt = isOpening
    ? `The claim under review: "${claim.text}"\n\nAsk your opening question — push on the part of this claim most likely to be challenged.`
    : `The claim under review: "${claim.text}"\n\nConversation so far:\n${historyText}\n\nAsk the next, sharper follow-up question, building directly on their last answer.`;

  try{
    const raw = await callClaude(sys, userPrompt);
    const parsed = extractJson(raw);
    const q = parsed.question || "Can you be more specific about how you know that's true?";
    document.getElementById('thinkingLine')?.remove();
    claim.transcript.push({role:'examiner', text:q});
    renderTranscript(claim);
    saveCurrent();
  }catch(err){
    document.getElementById('thinkingLine')?.remove();
    const fallback = fallbackQuestion(claim, isOpening);
    claim.transcript.push({role:'examiner', text: fallback});
    renderTranscript(claim);
    showTranscriptNotice("The examiner's connection glitched — using a standard follow-up instead.");
    saveCurrent();
  }
}

function fallbackQuestion(claim, isOpening){
  const bank = [
    "What evidence would you point to if someone doubted that outright?",
    "Is that true in every case, or are you generalizing from one example?",
    "What would someone who disagreed with you say, and how would you respond?",
    "How do you actually know that — what's it based on?",
    "What's the weakest part of that claim if I pushed on it?"
  ];
  return bank[Math.floor(Math.random()*bank.length)];
}

function showTranscriptNotice(msg){
  const body = document.getElementById('transcriptBody');
  if(!body) return;
  body.insertAdjacentHTML('beforeend', `<div class="notice error" style="margin:6px 0 16px;">${msg}</div>`);
  body.scrollTop = body.scrollHeight;
}

async function submitAnswer(){
  const input = document.getElementById('answerInput');
  const text = input.value.trim();
  if(!text) return;
  const claim = state.claims[state.activeClaimIdx];
  claim.transcript.push({role:'you', text});
  input.value = '';
  renderTranscript(claim);

  const submitBtn = document.getElementById('submitAnswer');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Reviewing…';

  await evaluateAnswer(claim);

  submitBtn.disabled = false;
  submitBtn.textContent = 'Submit answer →';

  // update docket stamp + gauge without full re-render (keeps transcript scroll)
  refreshSidebars();

  const exchanges = claim.transcript.filter(t=>t.role==='you').length;
  if(exchanges >= 3 || claim.stamp==='solid'){
    claim.resolved = true;
    refreshSidebars();
    setTimeout(()=>{ advanceClaim(); }, 500);
  }else{
    askNextQuestion(false);
  }
}

function refreshSidebars(){
  // re-render whole interview panel but keep the current claim's transcript scroll position appropriately
  renderInterview(document.getElementById('container'));
}

async function evaluateAnswer(claim){
  const historyText = claim.transcript.map(t=>`${t.role==='examiner'?'Examiner':'Candidate'}: ${t.text}`).join('\n');
  const sys = `You evaluate how well someone is defending a specific claim about their own work under skeptical questioning. Judge the LATEST candidate answer in context.

Return ONLY valid JSON, no markdown fences:
{"strength":"solid"|"estimated"|"shaky","note":"one short sentence naming the specific weakness or strength in their latest answer"}

Rules: "solid" = specific, evidenced, directly answers the challenge. "estimated" = plausible but light on hard evidence or somewhat vague. "shaky" = evasive, unsupported, contradicts itself, or dodges the question.`;
  const userPrompt = `Claim under review: "${claim.text}"\n\nTranscript:\n${historyText}\n\nEvaluate the candidate's most recent answer.`;
  try{
    const raw = await callClaude(sys, userPrompt);
    const parsed = extractJson(raw);
    claim.stamp = ['solid','estimated','shaky'].includes(parsed.strength) ? parsed.strength : 'estimated';
    claim.weaknessNote = parsed.note || '';
  }catch(err){
    if(claim.stamp==='pending') claim.stamp = 'estimated';
  }
  saveCurrent();
}

function advanceClaim(){
  if(state.activeClaimIdx < state.claims.length-1){
    state.activeClaimIdx++;
    render();
    askNextQuestion(true);
  }else{
    render();
  }
}

/* ============================================================
   REPORT
============================================================ */
async function generateReport(){
  state.phase = 'report';
  render();
  const c = document.getElementById('container');
  c.insertAdjacentHTML('beforeend', `<div style="text-align:center;padding:40px;" id="reportLoading">
    <span class="typing-dots"><span></span><span></span><span></span></span>
    <p style="color:var(--text-2);font-family:var(--mono);font-size:11px;margin-top:12px;">Compiling the defense report…</p>
  </div>`);

  const claimsSummary = state.claims.map((cl,i)=>{
    const exchange = cl.transcript.map(t=>`${t.role==='examiner'?'Q':'A'}: ${t.text}`).join(' / ');
    return `${i+1}. CLAIM: "${cl.text}" | CURRENT STAMP: ${cl.stamp} | EXCHANGE: ${exchange}`;
  }).join('\n\n');

  const sys = `You are compiling a final "Defense Report" after a mock cross-examination. For each claim, give a short, specific verdict grounded in what was actually said in the exchange — never generic advice.

Return ONLY valid JSON, no markdown fences:
{"claims":[{"index":0,"verdict":"solid"|"estimated"|"shaky","strength":"what specifically holds up, one sentence","gap":"the specific gap or weakness to close, one sentence","fix":"one concrete, specific action to strengthen it before a real interview"}]}`;

  try{
    const raw = await callClaude(sys, `Audience: ${labelForAudience(state.audience)}\n\n${claimsSummary}`);
    const parsed = extractJson(raw);
    (parsed.claims||[]).forEach(r=>{
      const cl = state.claims[r.index];
      if(cl){ cl.reportVerdict=r.verdict; cl.reportStrength=r.strength; cl.reportGap=r.gap; cl.reportFix=r.fix; }
    });
  }catch(err){
    state.claims.forEach(cl=>{
      cl.reportVerdict = cl.stamp;
      cl.reportStrength = cl.transcript.length ? "You engaged directly with the follow-up questions." : "Not fully explored in this session.";
      cl.reportGap = cl.weaknessNote || "Add a concrete example or number the next time this comes up.";
      cl.reportFix = "Prepare one specific, quantified example that backs this claim before your next real conversation.";
    });
    showReportNotice();
  }
  archiveSession();
  document.getElementById('reportLoading')?.remove();
  render();
}

function showReportNotice(){
  setTimeout(()=>{
    const c = document.getElementById('container');
    const notice = document.createElement('div');
    notice.className = 'notice error';
    notice.style.maxWidth='760px'; notice.style.margin='0 auto 20px';
    notice.innerHTML = 'The report compiler hit an API snag — showing a best-effort summary based on your transcript instead.';
    c.prepend(notice);
  }, 50);
}

function renderReport(c){
  const conf = overallConfidence();
  const solidCount = state.claims.filter(c=>c.stamp==='solid'||c.stamp==='sourced').length;
  const shakyCount = state.claims.filter(c=>c.stamp==='shaky'||c.stamp==='unverified').length;

  c.innerHTML = `
    <div style="max-width:820px;margin:0 auto;">
      <div class="report-hero">
        <div class="eyebrow">Defense report · Case #${state.id.slice(-5).toUpperCase()}</div>
        <h2>You're ready on ${solidCount} of ${state.claims.length}<br>claims. Here's the rest.</h2>
      </div>
      <div class="report-grid">
        <div class="report-stat"><div class="rs-num">${conf}%</div><div class="rs-label">Overall confidence</div></div>
        <div class="report-stat"><div class="rs-num">${solidCount}</div><div class="rs-label">Claims that hold up</div></div>
        <div class="report-stat"><div class="rs-num">${shakyCount}</div><div class="rs-label">Claims still shaky</div></div>
      </div>

      ${state.claims.map((cl,i)=>`
        <div class="claim-report">
          <div class="cr-head">
            <div class="cr-claim">${i+1}. ${escapeHtml(cl.text)}</div>
            <span class="stamp ${cl.reportVerdict||cl.stamp}">${stampLabel(cl.reportVerdict||cl.stamp)}</span>
          </div>
          <div class="cr-body">
            <div class="cr-section"><div class="cr-section-label">What holds up</div>${escapeHtml(cl.reportStrength||'—')}</div>
            <div class="cr-section"><div class="cr-section-label">The gap</div>${escapeHtml(cl.reportGap||'—')}</div>
            <div class="cr-section"><div class="cr-section-label">Before your next interview</div><strong>${escapeHtml(cl.reportFix||'—')}</strong></div>
          </div>
        </div>
      `).join('')}

      <div class="report-actions">
        <button class="btn" id="exportBtn">Export report (JSON)</button>
        <button class="btn ghost" id="printBtn">Print / save PDF</button>
        <button class="btn ghost" id="newBtn">Start new session</button>
      </div>
    </div>
  `;

  document.getElementById('exportBtn').addEventListener('click', exportReport);
  document.getElementById('printBtn').addEventListener('click', ()=>window.print());
  document.getElementById('newBtn').addEventListener('click', resetSession);
}

function exportReport(){
  const payload = {
    case: state.id,
    audience: state.audience,
    confidence: overallConfidence(),
    claims: state.claims.map(cl=>({
      claim: cl.text,
      verdict: cl.reportVerdict||cl.stamp,
      strength: cl.reportStrength,
      gap: cl.reportGap,
      fix: cl.reportFix,
      transcript: cl.transcript
    }))
  };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `defense-report-${state.id}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function resetSession(){
  state = { id:null, createdAt:null, sourceText:'', audience:null, claims:[], activeClaimIdx:0, phase:'landing', uploadedFileName:null };
  render();
}

document.getElementById('newSessionBtn').addEventListener('click', ()=>{
  if(state.phase==='interview' && state.claims.some(c=>c.transcript.length)){
    if(!confirm('Start a new session? Your current progress will be saved to history.')) return;
    archiveSession();
  }
  resetSession();
});

/* ============================================================
   INIT
============================================================ */
(function init(){
  const resumed = loadCurrent();
  if(resumed){ state = resumed; }
  render();
})();
</script>
